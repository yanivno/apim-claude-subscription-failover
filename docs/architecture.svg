<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 1110" width="1480" height="1110" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0078D4"/></marker>
    <marker id="arClay" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C2410C"/></marker>
    <marker id="arPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7C3AED"/></marker>
    <marker id="arGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker>
    <filter id="sh" x="-5%" y="-5%" width="110%" height="115%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.12"/></filter>
    <style>
      .t  { font-size:15px; fill:#0F172A; }
      .tb { font-size:16px; font-weight:600; fill:#0F172A; }
      .h  { font-size:20px; font-weight:700; fill:#0F172A; }
      .s  { font-size:13px; fill:#475569; }
      .m  { font-family: Consolas, Menlo, monospace; font-size:12.5px; fill:#334155; }
      .lbl{ font-size:13px; font-weight:600; }
      .zone{ font-size:13px; font-weight:700; letter-spacing:1.5px; }
    </style>
  </defs>

  <rect width="1480" height="1110" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="40" y="48" class="h" font-size="26">Claude Code gateway — Team subscription first, Foundry overflow</text>
  <text x="40" y="74" class="s" font-size="15">Azure API Management Standard v2 · per-user failover on HTTP 429 · no client-side switching</text>

  <!-- ===================== ZONES ===================== -->
  <!-- Developer zone -->
  <rect x="30" y="110" width="270" height="730" rx="14" fill="#F8FAFC" stroke="#CBD5E1" stroke-dasharray="6 5"/>
  <text x="50" y="138" class="zone" fill="#64748B">DEVELOPER WORKSTATION</text>

  <!-- Azure zone -->
  <rect x="330" y="110" width="820" height="730" rx="14" fill="#F0F7FF" stroke="#0078D4" stroke-width="1.5"/>
  <text x="350" y="138" class="zone" fill="#0078D4">AZURE SUBSCRIPTION</text>

  <!-- Anthropic zone -->
  <rect x="1180" y="110" width="270" height="300" rx="14" fill="#FFF7F2" stroke="#D97757" stroke-dasharray="6 5"/>
  <text x="1200" y="138" class="zone" fill="#C2410C">ANTHROPIC</text>

  <!-- ===================== CLIENT ===================== -->
  <g filter="url(#sh)">
    <rect x="50" y="160" width="230" height="250" rx="12" fill="#FFFFFF" stroke="#94A3B8"/>
  </g>
  <rect x="50" y="160" width="230" height="44" rx="12" fill="#1E293B"/>
  <rect x="50" y="190" width="230" height="14" fill="#1E293B"/>
  <text x="66" y="188" font-size="16" font-weight="700" fill="#FFFFFF">&gt;_ Claude Code</text>
  <text x="66" y="230" class="tb" font-size="14">Signed in with /login</text>
  <text x="66" y="250" class="s">Claude Team seat (OAuth)</text>
  <text x="66" y="282" class="tb" font-size="14">~/.claude/settings.json</text>
  <text x="66" y="303" class="m">ANTHROPIC_BASE_URL =</text>
  <text x="66" y="320" class="m">  https://&lt;apim&gt;/claude</text>
  <text x="66" y="341" class="m">ANTHROPIC_CUSTOM_HEADERS =</text>
  <text x="66" y="358" class="m">  Ocp-Apim-Subscription-Key</text>
  <text x="66" y="390" class="s">CLI and Desktop "Code" tab</text>

  <!-- request headers card -->
  <rect x="50" y="430" width="230" height="120" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="64" y="454" class="lbl" fill="#475569">REQUEST HEADERS</text>
  <text x="64" y="478" class="m">Authorization:</text>
  <text x="64" y="495" class="m">  Bearer sk-ant-oat… (seat)</text>
  <text x="64" y="516" class="m">Ocp-Apim-Subscription-Key</text>
  <text x="64" y="535" class="m">anthropic-beta: oauth-…</text>

  <text x="50" y="580" class="s">One APIM subscription per user</text>
  <text x="50" y="598" class="s">→ identity for limits &amp; metrics</text>

  <!-- ===================== APIM ===================== -->
  <g filter="url(#sh)">
    <rect x="360" y="160" width="560" height="510" rx="12" fill="#FFFFFF" stroke="#0078D4" stroke-width="1.5"/>
  </g>
  <rect x="360" y="160" width="560" height="48" rx="12" fill="#0078D4"/>
  <rect x="360" y="194" width="560" height="14" fill="#0078D4"/>
  <text x="380" y="191" font-size="17" font-weight="700" fill="#FFFFFF">API Management · Standard v2</text>
  <text x="900" y="191" font-size="13" fill="#DBEAFE" text-anchor="end">API /claude · product claude-code</text>

  <!-- Policy pipeline -->
  <text x="380" y="236" class="lbl" fill="#0078D4">POLICY PIPELINE  ·  POST /v1/messages</text>

  <!-- step 1 -->
  <rect x="380" y="250" width="250" height="62" rx="9" fill="#EFF6FF" stroke="#93C5FD"/>
  <circle cx="402" cy="281" r="13" fill="#0078D4"/><text x="402" y="286" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">1</text>
  <text x="424" y="275" class="tb" font-size="14">Validate subscription key</text>
  <text x="424" y="295" class="s">strip key · keep OAuth token</text>

  <!-- step 2 -->
  <rect x="380" y="326" width="250" height="62" rx="9" fill="#EFF6FF" stroke="#93C5FD"/>
  <circle cx="402" cy="357" r="13" fill="#0078D4"/><text x="402" y="362" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">2</text>
  <text x="424" y="351" class="tb" font-size="14">Lookup fallback flag</text>
  <text x="424" y="371" class="m">claude-fallback-{sub}</text>

  <!-- step 3 decision -->
  <polygon points="505,404 620,446 505,488 390,446" fill="#FFFFFF" stroke="#0078D4" stroke-width="1.5"/>
  <text x="505" y="442" class="tb" font-size="14" text-anchor="middle">User in</text>
  <text x="505" y="460" class="tb" font-size="14" text-anchor="middle">fallback?</text>

  <!-- step 4 anthropic forward -->
  <rect x="660" y="250" width="240" height="96" rx="9" fill="#FFF7F2" stroke="#FDBA74"/>
  <circle cx="682" cy="276" r="13" fill="#C2410C"/><text x="682" y="281" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">3</text>
  <text x="704" y="281" class="tb" font-size="14">Forward unchanged</text>
  <text x="676" y="306" class="s">backend: anthropic-direct</text>
  <text x="676" y="326" class="s">OAuth + anthropic-beta as-is</text>

  <!-- step 5 retry / rewrite -->
  <rect x="660" y="400" width="240" height="190" rx="9" fill="#F5F3FF" stroke="#C4B5FD"/>
  <circle cx="682" cy="426" r="13" fill="#7C3AED"/><text x="682" y="431" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">4</text>
  <text x="704" y="431" class="tb" font-size="14">Retry → Foundry</text>
  <text x="676" y="458" class="s">• cache flag until reset</text>
  <text x="676" y="478" class="s">   (retry-after / unified-reset)</text>
  <text x="676" y="500" class="s">• Authorization → MI token</text>
  <text x="676" y="522" class="s">• drop oauth-* beta flags</text>
  <text x="676" y="544" class="s">• model → deployment map</text>
  <text x="676" y="566" class="s">• llm-token-limit per user</text>

  <!-- internal arrows -->
  <line x1="505" y1="312" x2="505" y2="324" stroke="#0078D4" stroke-width="2" marker-end="url(#arBlue)"/>
  <line x1="505" y1="388" x2="505" y2="402" stroke="#0078D4" stroke-width="2" marker-end="url(#arBlue)"/>
  <!-- no -> anthropic forward -->
  <path d="M 590 435 C 625 410, 630 330, 658 305" fill="none" stroke="#C2410C" stroke-width="2" marker-end="url(#arClay)"/>
  <text x="586" y="414" class="lbl" fill="#C2410C">no</text>
  <!-- yes -> retry -->
  <path d="M 620 446 L 658 470" fill="none" stroke="#7C3AED" stroke-width="2" marker-end="url(#arPurple)"/>
  <text x="625" y="478" class="lbl" fill="#7C3AED">yes</text>

  <!-- APIM supporting components -->
  <rect x="380" y="516" width="125" height="64" rx="9" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="442" y="542" class="tb" font-size="13.5" text-anchor="middle">Cache</text>
  <text x="442" y="562" class="s" font-size="12" text-anchor="middle">fallback flags</text>

  <rect x="515" y="516" width="125" height="64" rx="9" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="577" y="542" class="tb" font-size="13.5" text-anchor="middle">Named values</text>
  <text x="577" y="562" class="s" font-size="12" text-anchor="middle">model map · limits</text>

  <rect x="380" y="592" width="260" height="58" rx="9" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="400" y="617" class="tb" font-size="13.5">Managed identity (system)</text>
  <text x="400" y="636" class="s" font-size="12">Cognitive Services User on Foundry</text>

  <rect x="660" y="604" width="250" height="46" rx="9" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="676" y="626" class="s" font-size="12.5">Response header</text>
  <text x="676" y="642" class="m" font-size="11.5">x-claude-route: anthropic | foundry</text>

  <!-- ===================== FOUNDRY ===================== -->
  <g filter="url(#sh)">
    <rect x="950" y="440" width="180" height="230" rx="12" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/>
  </g>
  <rect x="950" y="440" width="180" height="46" rx="12" fill="#7C3AED"/>
  <rect x="950" y="472" width="180" height="14" fill="#7C3AED"/>
  <text x="1040" y="470" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">Microsoft Foundry</text>
  <text x="966" y="512" class="tb" font-size="13.5">Claude deployments</text>
  <text x="966" y="534" class="m" font-size="11.5">claude-opus-5-5</text>
  <text x="966" y="551" class="m" font-size="11.5">claude-sonnet-5-5</text>
  <text x="966" y="568" class="m" font-size="11.5">claude-haiku-5-5</text>
  <text x="966" y="596" class="m" font-size="11.5">/anthropic/v1/messages</text>
  <text x="966" y="626" class="s" font-size="12.5">Entra auth (MI)</text>
  <text x="966" y="646" class="s" font-size="12.5">Billed to Azure</text>

  <!-- ===================== ANTHROPIC ===================== -->
  <g filter="url(#sh)">
    <rect x="1200" y="160" width="230" height="230" rx="12" fill="#FFFFFF" stroke="#D97757" stroke-width="1.5"/>
  </g>
  <rect x="1200" y="160" width="230" height="46" rx="12" fill="#D97757"/>
  <rect x="1200" y="192" width="230" height="14" fill="#D97757"/>
  <text x="1315" y="190" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">Anthropic API</text>
  <text x="1216" y="232" class="m">api.anthropic.com</text>
  <text x="1216" y="262" class="tb" font-size="14">Claude Team plan</text>
  <text x="1216" y="283" class="s">Per-seat usage limits</text>
  <text x="1216" y="303" class="s">Usage credits: OFF</text>
  <text x="1216" y="323" class="s">(so the limit returns 429)</text>
  <text x="1216" y="358" class="s">Billed on Team subscription</text>

  <!-- ===================== MONITORING ===================== -->
  <g filter="url(#sh)">
    <rect x="360" y="710" width="560" height="110" rx="12" fill="#FFFFFF" stroke="#94A3B8"/>
  </g>
  <text x="380" y="740" class="tb">Application Insights + Log Analytics</text>
  <text x="380" y="764" class="s">llm-emit-token-metric: tokens by User / Subscription</text>
  <text x="380" y="784" class="s">emit-metric claude-requests: by User · Route · Status</text>
  <text x="380" y="804" class="s">No body logging (keeps SSE streaming and prompts out of logs)</text>

  <!-- ===================== EXTERNAL ARROWS ===================== -->
  <!-- A: client -> APIM -->
  <line x1="282" y1="281" x2="378" y2="281" stroke="#0078D4" stroke-width="2.5" marker-end="url(#arBlue)"/>
  <rect x="296" y="252" width="66" height="20" rx="10" fill="#0078D4"/>
  <text x="329" y="266" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">HTTPS</text>

  <!-- B: APIM -> Anthropic -->
  <line x1="900" y1="290" x2="1198" y2="290" stroke="#C2410C" stroke-width="2.5" marker-end="url(#arClay)"/>
  <text x="1050" y="280" class="lbl" fill="#C2410C" text-anchor="middle">primary · seat OAuth token</text>

  <!-- C: Anthropic 429 back -->
  <path d="M 1198 340 C 1100 345, 1000 380, 902 418" fill="none" stroke="#C2410C" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arClay)"/>
  <rect x="1032" y="340" width="110" height="22" rx="11" fill="#FEE2E2" stroke="#F87171"/>
  <text x="1087" y="355" font-size="12.5" font-weight="700" fill="#B91C1C" text-anchor="middle">429 seat limit</text>

  <!-- D: APIM -> Foundry -->
  <line x1="900" y1="520" x2="948" y2="520" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#arPurple)"/>
  <text x="924" y="508" class="lbl" fill="#7C3AED" text-anchor="middle">MI</text>

  <!-- E: MI token -->
  <path d="M 640 621 C 650 621, 655 590, 662 575" fill="none" stroke="#6B7280" stroke-width="1.5" stroke-dasharray="3 4" marker-end="url(#arGray)"/>

  <!-- F: telemetry -->
  <line x1="640" y1="672" x2="640" y2="708" stroke="#6B7280" stroke-width="1.5" stroke-dasharray="3 4" marker-end="url(#arGray)"/>

  <!-- ===================== LEGEND & SEMANTICS ===================== -->
  <rect x="30" y="860" width="270" height="230" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="50" y="886" class="zone" fill="#64748B">LEGEND</text>
  <line x1="50" y1="910" x2="100" y2="910" stroke="#C2410C" stroke-width="2.5" marker-end="url(#arClay)"/>
  <text x="112" y="915" class="t" font-size="13.5">Primary: Team seat</text>
  <line x1="50" y1="940" x2="100" y2="940" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#arPurple)"/>
  <text x="112" y="945" class="t" font-size="13.5">Overflow: Foundry</text>
  <line x1="50" y1="970" x2="100" y2="970" stroke="#C2410C" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arClay)"/>
  <text x="112" y="975" class="t" font-size="13.5">429 triggers retry</text>
  <line x1="50" y1="1000" x2="100" y2="1000" stroke="#6B7280" stroke-width="1.5" stroke-dasharray="3 4" marker-end="url(#arGray)"/>
  <text x="112" y="1005" class="t" font-size="13.5">Identity / telemetry</text>
  <text x="50" y="1038" class="s" font-size="12.5">Switch happens before any bytes</text>
  <text x="50" y="1056" class="s" font-size="12.5">reach the client: streams are</text>
  <text x="50" y="1074" class="s" font-size="12.5">never cut over mid-flight.</text>

  <!-- what changes on fallback table -->
  <rect x="330" y="860" width="1120" height="230" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="350" y="888" class="zone" fill="#64748B">WHAT CHANGES ON FALLBACK</text>
  <line x1="350" y1="900" x2="1430" y2="900" stroke="#E2E8F0"/>
  <text x="350" y="920" class="lbl" fill="#475569">Field</text>
  <text x="560" y="920" class="lbl" fill="#C2410C">Anthropic route</text>
  <text x="960" y="920" class="lbl" fill="#7C3AED">Foundry route</text>
  <line x1="350" y1="930" x2="1430" y2="930" stroke="#E2E8F0"/>
  <text x="350" y="954" class="t" font-size="14">Authorization</text>
  <text x="560" y="954" class="s" font-size="13.5">seat OAuth token (pass-through)</text>
  <text x="960" y="954" class="s" font-size="13.5">APIM managed-identity Entra token</text>
  <text x="350" y="980" class="t" font-size="14">anthropic-beta</text>
  <text x="560" y="980" class="s" font-size="13.5">unchanged</text>
  <text x="960" y="980" class="s" font-size="13.5">oauth-* flags removed</text>
  <text x="350" y="1006" class="t" font-size="14">model</text>
  <text x="560" y="1006" class="s" font-size="13.5">Anthropic model ID</text>
  <text x="960" y="1006" class="s" font-size="13.5">mapped Foundry deployment name</text>
  <text x="350" y="1032" class="t" font-size="14">Limits</text>
  <text x="560" y="1032" class="s" font-size="13.5">Claude Team seat limits</text>
  <text x="960" y="1032" class="s" font-size="13.5">llm-token-limit per user (TPM + monthly quota)</text>
  <text x="350" y="1058" class="t" font-size="14">Billing</text>
  <text x="560" y="1058" class="s" font-size="13.5">Claude Team subscription</text>
  <text x="960" y="1058" class="s" font-size="13.5">Azure consumption</text>

  <!-- return to anthropic note -->
  <rect x="1180" y="440" width="270" height="230" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="1200" y="468" class="zone" fill="#64748B">LIFECYCLE PER USER</text>
  <circle cx="1210" cy="496" r="6" fill="#C2410C"/>
  <text x="1226" y="501" class="t" font-size="13.5">On seat → Anthropic</text>
  <circle cx="1210" cy="530" r="6" fill="#B91C1C"/>
  <text x="1226" y="535" class="t" font-size="13.5">First 429 → flag cached</text>
  <circle cx="1210" cy="564" r="6" fill="#7C3AED"/>
  <text x="1226" y="569" class="t" font-size="13.5">Until reset → Foundry</text>
  <text x="1226" y="588" class="s" font-size="12.5">(TTL 60 s – 5 h)</text>
  <circle cx="1210" cy="618" r="6" fill="#C2410C"/>
  <text x="1226" y="623" class="t" font-size="13.5">Flag expires → back to seat</text>
  <line x1="1210" y1="502" x2="1210" y2="524" stroke="#CBD5E1" stroke-width="2"/>
  <line x1="1210" y1="536" x2="1210" y2="558" stroke="#CBD5E1" stroke-width="2"/>
  <line x1="1210" y1="570" x2="1210" y2="612" stroke="#CBD5E1" stroke-width="2"/>
</svg>
